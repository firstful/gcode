<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Gcode Preview — gcode.ffilt.us</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="style.css">
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
</head>
<body>
<div id="app">
  <div id="viewport">
    <canvas id="canvas"></canvas>
    <div id="hud">
      <span class="badge" id="badge-moves">no file</span>
      <span class="badge" id="badge-layer">—</span>
      <span class="badge" id="badge-tool">—</span>
    </div>
  </div>
  <div id="side">
    <div class="card">
      <h2>File</h2>
      <div id="dropzone" class="drop">Drop .gcode / .3mf here<br>or click to browse</div>
      <input type="file" id="file" accept=".gcode,.3mf,.txt">
      <button id="btn-sample" style="margin-top:8px;width:100%">Load sample (recent plate)</button>
      <div id="status">No file loaded.</div>
    </div>
    <div class="card">
      <h2>Playback</h2>
      <div class="row">
        <button id="btn-play" class="primary" disabled>Play</button>
        <button id="btn-reset" disabled>Reset</button>
        <button id="btn-fit" disabled>Fit</button>
      </div>
      <label>Speed (layers/s)</label>
      <input type="range" id="speed" min="0.5" max="20" step="0.5" value="4">
      <div id="timeline">0 / 0</div>
      <div id="progress"><div id="progress-bar"></div></div>
      <label>Layer</label>
      <input type="range" id="layer" min="0" max="0" value="0">
    </div>
    <div class="card">
      <h2>Display</h2>
      <label>Color by</label>
      <select id="colorby">
        <option value="tool">Tool (filament)</option>
        <option value="layer">Layer</option>
        <option value="speed">Speed</option>
        <option value="height">Height (Z)</option>
      </select>
      <label>Trail (last N segments)</label>
      <input type="range" id="trail" min="0" max="5000" step="100" value="0">
      <div class="row" style="margin-top:6px">
        <label style="margin:0"><input type="checkbox" id="show-travel"> Travel</label>
        <label style="margin:0"><input type="checkbox" id="show-markers" checked> Markers</label>
        <label style="margin:0"><input type="checkbox" id="show-plate" checked> Plate</label>
        <label style="margin:0"><input type="checkbox" id="show-grid" checked> Grid</label>
      </div>
      <label>Opacity</label>
      <input type="range" id="opacity" min="0.1" max="1" step="0.05" value="0.85">
    </div>
    <div class="card">
      <h2>Tools</h2>
      <div class="legend" id="legend"></div>
    </div>
    <div class="card">
      <h2>Stats</h2>
      <div id="stats"></div>
    </div>
    <div class="card">
      <h2>Markers</h2>
      <div class="tools-list" id="markers"></div>
    </div>
  </div>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
